# Preguntas frecuentes (spec 003). Textos aprobados por el usuario.
# `paginas`: en qué páginas se muestra cada pregunta. El FAQPage (JSON-LD) se genera
# solo con las preguntas visibles en cada página.
# Variables disponibles en `respuesta`: {precio_certificado}, {precio_firmas}, {cantidad_firmas}
# (se rellenan desde la collection productos).

- id: que-es-la-firma-remota
  pregunta: ¿Qué es la firma remota?
  respuesta: 'Es una firma digital que no se descarga ni se instala: tu certificado vive en la nube y firmas tus documentos con tu usuario, tu PIN y un código que llega a tu WhatsApp.'
  paginas: [inicio]
  orden: 1

- id: que-necesito-para-firmar
  pregunta: ¿Qué necesito para firmar?
  respuesta: 'Dos cosas: un certificado digital y firmas disponibles. Si te falta una de las dos, no puedes firmar.'
  paginas: [inicio]
  orden: 2

- id: certificado-de-otro-proveedor
  pregunta: ¿Puedo usar un certificado de otro proveedor?
  respuesta: 'Sí. Puedes comprarnos solo las firmas y usarlas con tu certificado, o comprarnos el certificado y gestionar tus firmas por otro lado.'
  paginas: [inicio]
  orden: 3

- id: las-firmas-vencen
  pregunta: ¿Las firmas vencen?
  respuesta: 'No. Las firmas que compras no vencen; se descuentan a medida que firmas.'
  paginas: [inicio]
  orden: 4

# Los precios salen de la collection productos (P01, P02).
- id: cuanto-cuesta
  pregunta: ¿Cuánto cuesta?
  respuesta: 'El certificado digital cuesta {precio_certificado} y la bolsa mínima de {cantidad_firmas} firmas, {precio_firmas}. Los precios incluyen IGV.'
  paginas: [inicio]
  orden: 5

# PENDIENTE: P11 — redacción de la base legal a revisar.
# PENDIENTE: P12 — acreditación ante INDECOPI.
- id: validez-legal
  pregunta: ¿La firma remota tiene validez legal?
  respuesta: 'Sí. La firma digital tiene la misma validez que la firma manuscrita según la Ley N.° 27269, Ley de Firmas y Certificados Digitales.'
  paginas: [inicio]
  orden: 6
